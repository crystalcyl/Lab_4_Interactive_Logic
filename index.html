
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab 4 - Interactive Logic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>Think Before You React</h1>
        <p class="subtitle">
            Pause. Reflect. Choose your response.
        </p>

        <div class="card">
            <h2>What's happening?</h2>

            <textarea
                id="situation"
                placeholder="Describe the situation you're facing..."
            ></textarea>

            <label for="emotion">How are you feeling right now?</label>

            <select id="emotion">
                <option value="">Choose your emotion</option>
                <option value="angry">Angry 😠</option>
                <option value="sad">Sad 😔</option>
                <option value="stressed">Stressed 😰</option>
                <option value="calm">Calm 😌</option>
                <option value="confused">Confused 🤔</option>
            </select>

            <label for="reaction">What do you feel like doing?</label>

            <select id="reaction">
                <option value="">Choose your reaction</option>
                <option value="argue">Argue or respond immediately</option>
                <option value="avoid">Ignore the situation</option>
                <option value="talk">Talk it out calmly</option>
                <option value="think">Take time to think</option>
            </select>

            <button onclick="analyzeSituation()">
                Think It Through
            </button>
        </div>

        <div id="result" class="result hidden" aria-live="polite">
            <h2 id="resultTitle"></h2>
            <p id="resultMessage"></p>
            <p id="resultTip"></p>
            <button onclick="resetForm()" class="reset-btn">
                Start Again
            </button>
        </div>

        <p class="footer">Your feelings are valid. Your response is a choice.</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
